<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crash recovery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>body{margin:0;background:#050507}button{font-family:inherit;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #ffaa40;outline-offset:1px}</style>
</helmet>
<div role="dialog" aria-label="Restore unsaved changes" style="width:520px;height:460px;box-sizing:border-box;display:flex;flex-direction:column;background:#16161c;color:#e0e0e0;font-family:Inter,system-ui,sans-serif;font-size:13px;overflow:hidden;border:1px solid rgba(255,255,255,0.14);border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,0.45)">
  <div style="padding:20px 20px 8px;display:flex;flex-direction:column;gap:6px">
    <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;color:#fff">Restore unsaved changes?</h1>
    <span style="color:#b4bfce;line-height:1.5">Fizz Level Studio closed before these were saved. Recovery copies were kept beside your files, never over them.</span>
  </div>
  <div role="list" style="margin:8px 20px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);display:flex;flex-direction:column">
    <sc-for list="{{files}}" as="f" hint-placeholder-count="3"><label role="listitem" style="display:flex;align-items:center;gap:12px;min-height:56px;padding:0 12px;border-bottom:1px solid rgba(255,255,255,0.06)"><input type="checkbox" checked style="width:16px;height:16px;accent-color:#ffaa40;margin:0"><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#fff">{{f.n}}</span><span style="font-size:11.5px;color:#b4bfce">{{f.d}}</span></span><span style="font-size:11.5px;color:#7c8796;text-align:right">{{f.t}}</span></label></sc-for>
  </div>
  <div style="padding:4px 20px;font-size:11.5px;color:#7c8796;line-height:1.5">Kept in <span style="font-family:'JetBrains Mono',monospace">[app data]/recovery/</span> with a note of what each copy is. Restored changes open unsaved, so nothing is written until you save.</div>
  <div style="margin-top:auto;display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid rgba(255,255,255,0.08)">
    <button style="min-height:32px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,0.22);background:transparent;color:#e0e0e0">Decide later</button>
    <span style="flex-grow:1"></span>
    <button style="min-height:32px;padding:0 14px;border-radius:999px;border:1px solid rgba(244,63,94,0.5);background:transparent;color:#fb7185">Discard</button>
    <button style="min-height:32px;padding:0 14px;border-radius:999px;border:none;background:#ffaa40;color:#050507;font-weight:600">Restore selected</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":460}}'>
class Component extends DCLogic {
  renderVals() {
    const files = [['levels/light-1.fizz', 'Lighthouse Point · 3 changes: lamp-2, map row 5, rule 3', '[time]'], ['panels/cliffs-mid.json', 'A panel edited in the pixel editor', '[time]'], ['defs/enemies.fizz', 'beetle-bot: the charge mode', '[time]']].map((f) => ({ n: f[0], d: f[1], t: f[2] }));
    return { files: files };
  }
}
</script>
</body>
</html>
