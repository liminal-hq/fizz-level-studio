<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>body{margin:0;background:#050507}button{font-family:inherit;cursor:default}button:focus-visible,select:focus-visible{outline:2px solid #ffaa40;outline-offset:1px}</style>
</helmet>
<div style="width:880px;height:600px;box-sizing:border-box;display:flex;flex-direction:column;background:#16161c;color:#e0e0e0;font-family:Inter,system-ui,sans-serif;font-size:13px;overflow:hidden;border:1px solid rgba(255,255,255,0.12);border-radius:12px">
  <div style="height:40px;flex:none;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;column-gap:8px;padding:0 8px;background:#0c0c10;border-bottom:1px solid rgba(255,255,255,0.12)">
    <span></span><span>Settings</span>
    <div role="group" aria-label="Window controls" style="display:flex;justify-content:flex-end;gap:2px"><button aria-label="Close" title="Close" style="position:relative;width:28px;height:28px;padding:0;border:none;background:transparent;color:#e0e0e0;display:inline-flex;align-items:center;justify-content:center"><span aria-hidden="true" style="position:absolute;inset:2px;border-radius:50%;background:rgba(255,255,255,0.06)"></span><svg aria-hidden="true" style="position:relative" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button></div>
  </div>
  <div style="flex-grow:1;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr)">
    <nav aria-label="Settings sections" style="box-sizing:border-box;padding:12px 8px;background:#0c0c10;border-right:1px solid rgba(255,255,255,0.12)">
      <div style="display:flex;flex-direction:column;gap:2px">
        <sc-for list="{{nav}}" as="n" hint-placeholder-count="8"><button aria-current="{{n.cur}}" style="display:flex;align-items:center;gap:8px;min-height:28px;padding:0 10px;border:none;border-radius:6px;text-align:left;font-size:13px;{{n.s}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.8"><path d="{{n.d}}"></path></svg>{{n.n}}</button></sc-for>
      </div>
    </nav>
    <div style="padding:16px 20px;display:flex;flex-direction:column;gap:16px;overflow:hidden">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <section style="display:flex;flex-direction:column;gap:6px">
          <h2 style="margin:0;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;color:#fff">{{g.t}}</h2>
          <div style="border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.02);display:flex;flex-direction:column">
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
              <div style="display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid rgba(255,255,255,0.06)">
                <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="color:#e0e0e0">{{r.k}}</span><span style="font-size:11.5px;color:#9a9a9a">{{r.h}}</span></span>
                <sc-if value="{{r.seg}}" hint-placeholder-val="{{false}}"><div role="radiogroup" aria-label="{{r.k}}" style="display:flex;padding:2px;border-radius:8px;background:rgba(255,255,255,0.08)"><sc-for list="{{r.opts}}" as="o" hint-placeholder-count="3"><button role="radio" aria-checked="{{o.on}}" style="height:24px;padding:0 12px;border:none;border-radius:6px;font-size:12px;{{o.s}}">{{o.n}}</button></sc-for></div></sc-if>
                <sc-if value="{{r.val}}" hint-placeholder-val="{{false}}"><span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#e0e0e0;text-align:right">{{r.v}}</span></sc-if>
                <sc-if value="{{r.btn}}" hint-placeholder-val="{{false}}"><button style="height:28px;padding:0 12px;border-radius:6px;border:none;background:rgba(255,255,255,0.08);color:#e0e0e0;font-size:12px">{{r.v}}</button></sc-if>
              </div>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const nav = [['General', 'M8 10.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z M8 1.5v2 M8 12.5v2 M1.5 8h2 M12.5 8h2', 1], ['Appearance', 'M8 2a6 6 0 1 0 0 12V2z'], ['Keyboard', 'M2 4h12v8H2z M5 9.5h6'], ['Worlds and files', 'M2 4h4l1.5 1.5H14v8H2z'], ['Games', 'M3 6h10v6H3z M6 9h1 M10 8.5v1'], ['Claude', 'M8 2l1.5 4.5L14 8l-4.5 1.5L8 14l-1.5-4.5L2 8l4.5-1.5z'], ['Updates', 'M8 2v8 M5 7l3 3 3-3 M3 13h10'], ['About', 'M8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12z M8 7v4']].map((n) => ({ n: n[0], d: n[1], cur: n[2] ? 'page' : 'false', s: n[2] ? 'background:rgba(255,170,64,0.12);color:#ffaa40' : 'background:transparent;color:#c4c4c4' }));
    const seg = (k, h, opts, on) => ({ k: k, h: h, seg: true, val: false, btn: false, opts: opts.map((o) => ({ n: o, on: o === on ? 'true' : 'false', s: o === on ? 'background:#2b2d31;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.3)' : 'background:transparent;color:#9a9a9a' })) });
    const val = (k, h, v) => ({ k: k, h: h, seg: false, val: true, btn: false, v: v, opts: [] });
    const btn = (k, h, v) => ({ k: k, h: h, seg: false, val: false, btn: true, v: v, opts: [] });
    const groups = [
      { t: 'Appearance and language', rows: [seg('Theme', 'Follows the system colour scheme, contrast and motion', ['System', 'Dark', 'Light'], 'System'), seg('Language', 'English (Canada) first; others later (Q38)', ['English (Canada)'], 'English (Canada)'), btn('Keyboard shortcuts', 'The studio\'s keys, F6 and Ctrl+F6 for panes and windows', 'Show all…')] },
      { t: 'Worlds and files', rows: [val('Autosave', 'A recovery copy, never over the real file', 'every [interval]'), btn('Recent worlds', '3 kept in the settings document', 'Clear list…')] },
      { t: 'Games the studio is pinned to', rows: [val('Lieutenant Fizz 2', 'Read for these docs at main ba1ec8e; fizz-script and fizz-bake not built yet', '[path] · ba1ec8e'), val('Lieutenant Fizz', 'The Fizz 1 game crates, for proofs and the retro art', '[path] · [commit]'), val('Profiles', 'Generated from each game\'s tables once they publish them (F2)', 'fizz1 · ep2')] }
    ];
    return { nav: nav, groups: groups };
  }
}
</script>
</body>
</html>
