<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Side-by-side split arrangement</title>
<script src="./support.js"></script>
<script src="./level-data.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>body{margin:0;background:#050507}button{font-family:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #ffaa40;outline-offset:1px}</style>
</helmet>
<div style="width:1440px;height:900px;box-sizing:border-box;display:flex;flex-direction:column;background:#050507;color:#e0e0e0;font-family:Inter,system-ui,sans-serif;font-size:13px;overflow:hidden">

  <div style="height:40px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px 0 16px;background:#0c0c10;border-bottom:1px solid rgba(255,255,255,0.08)">
    <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;background:linear-gradient(135deg,#ffaa40,#f43f5e,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent">fizz level studio</span>
    <span style="font-weight:500;color:#fff">Crater Fields — draft</span>
    <div style="display:flex;justify-content:flex-end;gap:2px">
      <button aria-label="Minimise" style="width:36px;height:28px;border:none;border-radius:6px;background:transparent;color:#b4bfce"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10"/></svg></button>
      <button aria-label="Maximise" style="width:36px;height:28px;border:none;border-radius:6px;background:transparent;color:#b4bfce"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg></button>
      <button aria-label="Close" style="width:36px;height:28px;border:none;border-radius:6px;background:transparent;color:#b4bfce"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
  </div>

  <div style="flex-grow:1;min-height:0;display:flex">

    <!-- level pane -->
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column">
      <div style="height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid rgba(255,255,255,0.08);background:#0c0c10">
        <sc-for list="{{tools}}" as="t" hint-placeholder-count="4">
          <button style="min-height:32px;padding:0 12px;border-radius:8px;border:1px solid {{t.ring}};background:{{t.fill}};color:{{t.ink}};font-size:12px;font-weight:500">{{t.label}}</button>
        </sc-for>
        <span style="width:1px;height:20px;background:rgba(255,255,255,0.14)"></span>
        <sc-for list="{{palette}}" as="p" hint-placeholder-count="8">
          <button aria-label="{{p.name}}" title="{{p.name}}" style="width:32px;height:32px;border-radius:8px;border:1px solid {{p.ring}};background:{{p.fill}};display:flex;align-items:center;justify-content:center"><span style="width:16px;height:16px;border-radius:3px;background:{{p.sw}}"></span></button>
        </sc-for>
      </div>
      <div style="flex-grow:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px;background-color:#050507;background-image:radial-gradient(rgba(255,255,255,0.07) 1px,transparent 1px);background-size:24px 24px">
        <div style="display:grid;grid-template-columns:repeat({{cols}},22px);grid-auto-rows:22px;border:1px solid rgba(255,255,255,0.14);border-radius:4px;background:#0f0e1a;box-shadow:0 4px 24px rgba(0,0,0,0.45);overflow:hidden">
          <sc-for list="{{cells}}" as="c" hint-placeholder-count="20">
            <div style="width:22px;height:22px;box-sizing:border-box;background:{{c.bg}};outline:{{c.outline}};outline-offset:-1px;opacity:{{c.opacity}};display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;line-height:1;color:{{c.ink}}">{{c.glyph}}</div>
          </sc-for>
        </div>
      </div>
    </div>

    <!-- divider -->
    <div style="width:12px;flex:none;background:#0c0c10;border-left:1px solid rgba(255,255,255,0.08);border-right:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:col-resize">
      <span style="width:3px;height:36px;border-radius:2px;background:#7c8796"></span>
    </div>

    <!-- editor pane -->
    <div style="width:520px;flex:none;display:flex;flex-direction:column">
      <div style="height:44px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 12px;border-bottom:1px solid rgba(255,255,255,0.08);background:#0c0c10">
        <span style="padding:11px 10px;border-bottom:2px solid #ffaa40;color:#fff;font-weight:500;font-family:'JetBrains Mono',monospace;font-size:12px">crater.fizz</span>
        <span style="padding:11px 10px;color:#7c8796;font-size:12px">Claude</span>
        <span style="padding:11px 10px;color:#7c8796;font-size:12px">Checks</span>
        <span style="flex-grow:1"></span>
        <button aria-label="Swap sides" title="Swap sides" style="width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,0.14);background:transparent;color:#b4bfce"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5.5h9m0 0L9.5 3M12 5.5L9.5 8M13 10.5H4m0 0L6.5 8M4 10.5L6.5 13"/></svg></button>
        <button aria-label="Float the editor" title="Float the editor" style="width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,0.14);background:transparent;color:#b4bfce"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="4.5" width="8" height="8" rx="1.5"/><path d="M6 2.5h7.5V10"/></svg></button>
      </div>
      <div style="flex-grow:1;min-height:0;padding:12px 0;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;overflow:hidden">
        <sc-for list="{{lines}}" as="l" hint-placeholder-count="20">
          <div style="display:flex;background:{{l.bg}}"><span style="width:44px;flex:none;text-align:right;padding-right:14px;color:#7c8796;box-sizing:border-box">{{l.n}}</span><span style="width:16px;flex:none;color:#a78bfa">{{l.mark}}</span><span style="white-space:pre;color:{{l.ink}}">{{l.text}}</span></div>
        </sc-for>
      </div>
      <div style="flex:none;padding:12px 16px;border-top:1px solid rgba(255,255,255,0.08);background:rgba(167,139,250,0.08);display:flex;align-items:center;gap:12px">
        <span style="width:8px;height:8px;border-radius:50%;background:#a78bfa"></span>
        <span style="flex-grow:1;color:#b4bfce">Claude suggests lines 22 and 23</span>
        <button style="min-height:44px;padding:0 16px;border-radius:999px;border:none;background:#ffaa40;color:#050507;font-weight:600">Accept</button>
      </div>
    </div>
  </div>

  <div style="height:28px;flex:none;display:flex;align-items:center;gap:20px;padding:0 16px;background:#0c0c10;border-top:1px solid rgba(255,255,255,0.08);font-size:12px;color:#7c8796">
    <span>Split 60 / 40</span><span style="flex-grow:1"></span><span>Drag the divider to resize · double-click to reset</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const lv = window.FizzLevel.cells({ ghosts: true });
    const lines = window.FizzLevel.script().map((r, i) => ({
      n: i + 1, mark: r[1], text: r[0], bg: r[1] ? 'rgba(167,139,250,0.14)' : 'transparent',
      ink: (/^[a-z]+$/.test(r[0]) && r[0] !== '') ? '#ffaa40' : (r[1] ? '#fff' : '#e0e0e0')
    }));
    const tools = ['Paint', 'Erase', 'Pick', 'Select'].map((t, i) => ({ label: t, ring: i === 0 ? '#ffaa40' : 'rgba(255,255,255,0.14)', fill: i === 0 ? 'rgba(255,170,64,0.1)' : 'transparent', ink: i === 0 ? '#ffaa40' : '#e0e0e0' }));
    const pal = [['Fill', '#2b2540'], ['Block', '#6a58a8'], ['One-way', '#ffaa40'], ['Chocolate', '#7a4527'], ['Spikes', '#f43f5e'], ['Gloop', '#f43f5e'], ['Cheezie', '#fbbf24'], ['Soda', '#22d3ee']];
    return { cols: lv.cols, cells: lv.cells, lines: lines, tools: tools, palette: pal.map((p, i) => ({ name: p[0], sw: p[1], ring: i === 1 ? '#ffaa40' : 'rgba(255,255,255,0.08)', fill: i === 1 ? 'rgba(255,170,64,0.1)' : 'transparent' })) };
  }
}
</script>
</body>
</html>
