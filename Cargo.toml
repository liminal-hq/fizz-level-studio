[workspace]
members = [
	"crates/fizz-studio-dialect",
	"crates/fizz-studio-host",
	"crates/fizz-studio-language",
	"crates/fizz-studio-profile",
]
# The proof workspace is a copy of the game's crates and builds on its own.
exclude = ["scratch/rust"]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Liminal HQ, Scott Morris"]
license = "Apache-2.0 OR MIT"
rust-version = "1.98.0"
homepage = "https://github.com/liminal-hq/fizz-level-studio"
repository = "https://github.com/liminal-hq/fizz-level-studio"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

[profile.release]
strip = true
