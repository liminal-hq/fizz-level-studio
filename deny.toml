# Licence policy for every crate the studio depends on.
#
# The studio is `Apache-2.0 OR MIT`. Everything linked in must be under a permissive licence, apart from
# MPL-2.0 below, so a new dependency under any other copyleft licence fails the check and has to be
# looked at by a person.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  # MPL-2.0 is file-level copyleft: fine when a crate is used unmodified. Tauri's web stack brings
  # `cssparser`, `selectors`, `dtoa-short` and `option-ext`. Each is listed in the third-party notices.
  "MPL-2.0",
  # The Boost licence is permissive (no copyleft, no attribution in binaries). `clipboard-win` and
  # `error-code` (Windows only) arrive with `tauri-plugin-clipboard-manager`, which the text-field
  # menu's Paste reads the clipboard with.
  "BSL-1.0",
]

# Git dependencies are the two games' crates, pinned by revision (D58). Any other git source, and any
# registry other than crates.io, is refused until someone decides it belongs here.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/liminal-hq/lieutenant-fizz",
  "https://github.com/ScottMorris/lieutenant-fizz-2",
]
