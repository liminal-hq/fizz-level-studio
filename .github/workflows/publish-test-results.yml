# Posts the test results of a finished CI run to its pull request as a comment and a check run.
#
# Split out from ci.yml because the pull_request event's own GITHUB_TOKEN is read-only for
# Dependabot and fork PRs, and EnricoMi/publish-unit-test-result-action needs `checks: write` to
# create its check run. A `workflow_run` trigger always runs with this workflow file's own
# permissions, from the default branch, whoever opened the originating PR.
#
